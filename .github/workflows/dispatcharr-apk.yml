name: OwnTV Dispatcharr - test APK

# This experimental workflow compiles the two forks together.
# It never publishes releases and never touches the main branch.
on:
  push:
    branches:
      - feature/dispatcharr-source-switch
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: dispatcharr-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-apk:
    if: github.event_name == 'push' || github.head_ref == 'feature/dispatcharr-source-switch'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Checkout TV fork
        uses: actions/checkout@v4
        with:
          path: OwnTV
          persist-credentials: false

      - name: Checkout matching Core fork branch
        uses: actions/checkout@v4
        with:
          repository: faz17/OwnTV_Core
          ref: feature/dispatcharr-source-switch
          path: OwnTV_Core
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check Core tests
        working-directory: OwnTV_Core
        run: |
          chmod +x ./gradlew
          ./gradlew :core:testDebugUnitTest :player-core:testDebugUnitTest --stacktrace --no-daemon

      - name: Compile Android TV debug APK against local Core
        working-directory: OwnTV
        env:
          CORE_DIR: ${{ github.workspace }}/OwnTV_Core
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleStandardDebug "-Powntv.corePath=$CORE_DIR" --stacktrace --no-daemon

      - name: Upload experimental APK
        uses: actions/upload-artifact@v4
        with:
          name: OwnTV-Dispatcharr-experimental-debug
          path: OwnTV/app/build/outputs/apk/standard/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload error reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: OwnTV-Dispatcharr-build-reports
          path: |
            OwnTV_Core/core/build/reports/tests/**
            OwnTV_Core/player-core/build/reports/tests/**
            OwnTV/app/build/reports/**
          if-no-files-found: ignore
